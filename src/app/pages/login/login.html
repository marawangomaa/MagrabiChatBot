<div class="login-page">
  <div class="login-card">
    <div class="brand">
      <div class="logo">M</div>
      <h1>Magrabi Assistant</h1>
      <p>Call Center Knowledge Base</p>
    </div>

    <form (ngSubmit)="login()">
      <label>Email</label>
      <input
        [(ngModel)]="email"
        name="email"
        type="email"
        placeholder="you@example.com"
        required
        autocomplete="username"
      />

      <label>Password</label>
      <input
        [(ngModel)]="password"
        name="password"
        type="password"
        placeholder="••••••••"
        required
        autocomplete="current-password"
      />

      @if (error) {
        <div class="error">{{ error }}</div>
      }

      <button type="submit" [disabled]="loading">
        @if (loading) { Signing in… } @else { Sign In }
      </button>
    </form>

    <p class="hint">Internal use only · © Magrabi Group</p>
  </div>
</div>
